[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "styx-proxy"
version = "1.0.0"
description = "The proxy intelligence framework — auto-detect, anonymize, grade and export thousands of proxies with a live terminal dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "0xKuraishY" }]
keywords = ["proxy", "proxies", "checker", "socks5", "socks4", "http-proxy", "scanner", "anonymity", "asyncio"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "aiohttp>=3.9",
    "aiohttp-socks>=0.9",
    "rich>=13.0",
]

[project.scripts]
styx = "styx.cli:main"

[project.urls]
Homepage = "https://github.com/0xKuraishY/Styx"

[tool.setuptools]
packages = ["styx"]
